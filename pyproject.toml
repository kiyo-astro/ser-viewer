[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ser-viewer"
version = "1.0.0"
description = "SER Viewer - a player for the SER astronomy video format, with FITS export"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kiyoaki Okudaira" }]
keywords = ["astronomy", "SER", "FITS", "planetary imaging", "solar imaging"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "PySide6>=6.6",
    "numpy>=1.24",
    "astropy>=5.3",
    "opencv-python-headless>=4.8",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
build = ["pyinstaller>=6.3"]

[project.gui-scripts]
ser-viewer = "serview.main:main"
serview = "serview.main:main"

[project.urls]
Homepage = "https://github.com/kiyo-astro/ser-viewer"
Repository = "https://github.com/kiyo-astro/ser-viewer"
Issues = "https://github.com/kiyo-astro/ser-viewer/issues"

[tool.setuptools.packages.find]
include = ["serview*"]

[tool.setuptools.package-data]
serview = ["resources/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
